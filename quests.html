<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quests — Travel and Challenge</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/desktop.css">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/pages/quests.css">
</head>
<body>
<nav id="site-nav" aria-label="Main"></nav>
<main class="section"><div class="container">
  <h1>Quests</h1>
  <form id="filters" class="filters">
    <div class="form-field"><label for="difficulty">Difficulty</label>
      <select id="difficulty"><option value="">All</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></div>
    <div class="form-field"><label for="type">Type</label>
      <select id="type"><option value="">All</option><option value="quiz">Quiz</option><option value="code">Check-in code</option></select></div>
    <div class="form-field"><label for="state">Status</label>
      <select id="state"><option value="">All</option><option value="new">Not started</option><option value="in_progress">In progress</option><option value="completed">Completed</option></select></div>
  </form>
  <p id="status" role="status" class="muted">Loading…</p>
  <div id="list" class="quest-grid"></div>
</div></main>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form method="dialog" id="dlg-close-form"><button class="btn btn-small btn-ghost" aria-label="Close">✕</button></form>
  <h2 id="dlg-title"></h2>
  <p id="dlg-desc"></p>
  <div id="dlg-msg" role="alert"></div>
  <form id="quest-form"></form>
</dialog>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/quests-page.js"></script>
</body>
</html>
