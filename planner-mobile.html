<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<title>วางแผนทริป — Travel and Challenge</title>
<meta name="description" content="สร้างแผนเที่ยวรายวันตามจังหวัด งบประมาณ และความสนใจ แล้วบันทึกไว้ใช้ต่อ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/mobile-app.css">
<link rel="stylesheet" href="/css/pages/planner-mobile.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="app-phone" data-app-page="planner">

<main class="app-main pl-head">
  <p class="app-kicker">TRIP PLANNER</p>
  <h1>วางแผนทริป</h1>
  <p class="app-sub">บอกจังหวัด จำนวนวัน และความสนใจ เราจะจัดเส้นทางให้พร้อมออกเดินทาง</p>

  <form class="pl-form" id="plannerForm">
    <div class="pl-grid2">
      <div class="g-field">
        <label for="plProvince"><svg class="ic" width="12" height="12" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-map"></use></svg> จังหวัด</label>
        <select id="plProvince"></select>
      </div>
      <div class="g-field">
        <label for="plDays">จำนวนวัน</label>
        <select id="plDays">
          <option value="1">1 วัน</option>
          <option value="2" selected>2 วัน</option>
          <option value="3">3 วัน</option>
          <option value="4">4 วัน</option>
          <option value="5">5 วัน</option>
        </select>
      </div>
      <div class="g-field">
        <label for="plPace">จังหวะเที่ยว</label>
        <select id="plPace">
          <option value="relaxed">ชิล ๆ · 2 จุด/วัน</option>
          <option value="balanced" selected>สมดุล · 3 จุด/วัน</option>
          <option value="packed">เต็มวัน · 4 จุด/วัน</option>
        </select>
      </div>
      <div class="g-field">
        <label for="plBudget">งบประมาณ (บาท)</label>
        <input id="plBudget" type="number" min="0" step="100" value="3000" inputmode="numeric">
      </div>
    </div>

    <div class="g-field" style="margin-bottom:12px">
      <label>ความสนใจ</label>
      <div class="pl-chips" id="plInterests"></div>
    </div>

    <button class="g-btn g-btn--block pl-submit" type="submit">
      <svg class="ic" width="18" height="18" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-ai"></use></svg>
      สร้างแผนทริป
    </button>
  </form>

  <div class="pl-summary" id="plSummary" hidden></div>

  <section class="pl-result" id="plResult" aria-live="polite"></section>

  <section class="pl-saved">
    <h2>แผนที่บันทึกไว้</h2>
    <div id="plSavedList"></div>
  </section>
</main>

<script type="module" src="/js/mobile-app.js"></script>
<script type="module" src="/js/planner-mobile.js"></script>
</body>
</html>
