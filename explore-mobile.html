<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07130f">
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<title>แผนที่ผจญภัย AR — Travel and Challenge</title>
<meta name="description" content="เดินตัวละคร 3D บนแผนที่ไทย แตะหมุดเพื่อสำรวจสถานที่และทำเควสท์">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/mobile-app.css">
<link rel="stylesheet" href="/css/pages/ar-mobile.css">
<link rel="stylesheet" href="/css/pages/explore-mobile.css">
</head>
<body class="app-phone app-explore" data-app-page="explore">

<main class="ex" aria-label="แผนที่ผจญภัย AR">
  <div class="ex-map" id="exMap"></div>

  <div class="ex-top">
    <div class="ex-title-row">
      <span class="ex-title">
        <svg class="ic" width="14" height="14" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-compass"></use></svg>
        แผนที่ผจญภัย
      </span>
      <span class="ex-live">AR LIVE</span>
    </div>
    <div class="ex-chips" id="exChips" aria-label="เลือกจังหวัด"></div>
  </div>

  <div class="ex-legend" aria-hidden="true">
    <span><i></i> สถานที่ท่องเที่ยว</span>
    <span><i></i> เควสท์แนะนำ</span>
    <span><i></i> เส้นทางเดิน</span>
  </div>

  <div class="ex-fabs">
    <button class="ex-fab" type="button" id="exRecenter" aria-label="กลับจุดเริ่มต้น">
      <svg class="ic" width="20" height="20" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-gps"></use></svg>
    </button>
    <button class="ex-fab ex-fab--gold" type="button" id="exListBtn" aria-label="รายการสถานที่">
      <svg class="ic" width="20" height="20" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-menu"></use></svg>
    </button>
  </div>

  <section class="ex-card is-hidden" id="exCard" aria-label="สถานที่ที่เลือก">
    <button class="ex-card__close" type="button" id="exCloseCard" aria-label="ปิดการ์ด">
      <svg class="ic" width="12" height="12" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-close"></use></svg>
    </button>
    <span class="ex-card__media">
      <img id="exCardImg" alt="" referrerpolicy="no-referrer">
      <span class="fallback" id="exCardFallback" hidden>📍</span>
    </span>
    <div class="ex-card__body">
      <h2 id="exCardName">สถานที่</h2>
      <div class="ex-card__meta" id="exCardMeta"></div>
      <span class="ex-card__hint" id="exCardHint"></span>
      <div class="ex-card__actions">
        <button class="g-btn g-btn--sm g-btn--mint" type="button" id="exWalk">เดินไป</button>
        <a class="g-btn g-btn--sm g-btn--ghost" id="exDetail" href="#">รายละเอียด</a>
        <a class="g-btn g-btn--sm g-btn--ghost" id="exNav" href="#">นำทาง</a>
      </div>
    </div>
  </section>
</main>

<dialog class="app-sheet ex-sheet" id="exListSheet" aria-labelledby="exListTitle">
  <div class="dialog-bar">
    <strong id="exListTitle">สถานที่บนแผนที่</strong>
    <button class="sheet-close" type="button" data-close-explore aria-label="ปิดรายการ">
      <svg class="ic" width="16" height="16" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-close"></use></svg>
    </button>
  </div>
  <div class="dialog-scroll">
    <p class="app-tiny" style="margin:0 0 10px">แตะสถานที่เพื่อให้ตัวละครเดินไปอัตโนมัติ</p>
    <div class="ex-list" id="exList"></div>
  </div>
</dialog>

<script type="module" src="/js/mobile-app.js"></script>
<script type="module" src="/js/explore-mobile.js"></script>
</body>
</html>
