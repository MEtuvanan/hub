<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar — Travel and Challenge</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/desktop.css">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/pages/calendar.css">
</head>
<body>
<nav id="site-nav" aria-label="Main"></nav>
<main class="section"><div class="container">
  <h1>Travel calendar</h1>
  <div class="cal-head">
    <button class="btn btn-small btn-ghost" id="prev" aria-label="Previous month">‹</button>
    <h2 id="month" aria-live="polite"></h2>
    <button class="btn btn-small btn-ghost" id="next" aria-label="Next month">›</button>
  </div>
  <p id="status" role="status" class="muted"></p>
  <div id="grid" class="cal-grid" role="grid" aria-label="Month"></div>
  <p class="legend muted"><span class="dot dot-diary"></span> Journal <span class="dot dot-quest"></span> Quest completed</p>
  <section aria-live="polite"><h2 id="day-title">Select a date</h2><div id="day"></div></section>
</div></main>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/calendar.js"></script>
</body>
</html>
