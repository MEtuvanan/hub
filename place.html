<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destination — Travel and Challenge</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/desktop.css">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/pages/place.css">
</head>
<body>
<nav id="site-nav" aria-label="Main"></nav>
<main class="section"><div class="container">
  <p><a href="/explore">&larr; Back to Explore</a></p>
  <p id="status" role="status" class="muted">Loading…</p>
  <article id="place" hidden>
    <h1 id="name"></h1>
    <p id="meta"></p>
    <div id="gallery" class="gallery"></div>
    <div class="split">
      <div>
        <h2>About</h2><p id="description"></p>
        <h2>Visitor information</h2><p id="visitor"></p>
        <h2>Quests</h2><ul id="quests"><li class="muted">Loading quests…</li></ul>
        <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem; flex-wrap: wrap;">
          <a class="btn btn-small" id="btn-plan-trip" href="/planner">🗺️ Include in AI Trip Plan</a>
          <a class="btn btn-small btn-ghost" id="btn-write-journal" href="/journal">📖 Write Diary Entry</a>
        </div>
      </div>
      <div><div id="map" class="mini-map" aria-label="Location map"></div><p id="coords" class="muted"></p><p id="map-error" class="alert alert-error" hidden></p></div>
    </div>
  </article>
</div></main>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/place.js"></script>
</body>
</html>
